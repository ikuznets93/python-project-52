{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Update user" %}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-6">{% trans "Update user" %}</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded">{% trans "Update" %}</button>
        </form>
    </div>
</div>
{% endblock %}
