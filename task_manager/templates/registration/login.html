{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Task manager" %}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
        <h1 class="text-4xl font-semibold text-gray-900 mb-2">{% trans "Log in" %}</h1>
        <form action="{% url 'login' %}" method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">{% trans "Username" %}</label>
                <input type="text" name="username" id="username" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{% trans "Password" %}</label>
                <input type="password" name="password" id="password" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded">{% trans "Log in" %}</button>
        </form>
    </div>
</div>
{% endblock %}
