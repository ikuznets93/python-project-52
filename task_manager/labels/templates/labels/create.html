{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Create label" %}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
        <h1 class="text-4xl font-semibold text-gray-900 mb-2">{% trans "Create label" %}</h1>
        <form action="{% url 'label_create' %}" method="post" class="space-y-4">
            {% csrf_token %}
            {% include "includes/form.html" %}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md">
                {% trans "Create" %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
