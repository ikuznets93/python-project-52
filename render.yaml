databases:
  - name: task-manager-db
    plan: free
    databaseName: task_manager
    user: task_manager

services:
  - type: web
    name: task-manager
    runtime: python
    plan: free
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput
    startCommand: uv run python manage.py migrate --noinput && uv run gunicorn task_manager.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
