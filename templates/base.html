{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
{% load tailwind_cli %}
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    {% tailwind_css %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white border-b">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-6">
                    <a href="#" class="text-lg font-semibold text-gray-900">{% trans "Task manager" %}</a>
                    <nav class="hidden sm:flex space-x-4 text-sm">
                        <a href="#" class="text-gray-600 hover:text-gray-900">{% trans "Users" %}</a>
                    </nav>
                </div>
                <div class="text-sm space-x-4">
                    <a href="#" class="text-gray-700 hover:text-gray-900">{% trans "Sign in" %}</a>
                    <a href="#" class="text-gray-700 hover:text-gray-900">{% trans "Sign up" %}</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1">
        <div class="container mx-auto px-4 py-10">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="border-t bg-white">
        <div class="container mx-auto px-4 py-6">
            <div class="text-sm text-gray-600">Hexlet</div>
        </div>
    </footer>
</body>
</html>
