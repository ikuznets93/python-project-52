{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="mt-6 flex justify-center">
  <div class="w-full max-w-xl">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
        <h1 class="text-xl font-semibold text-gray-900">{% block form_title %}{% endblock %}</h1>
      </div>
      <div class="p-6">
        <p class="text-gray-700">
          {% translate "Are you sure you want to delete" %} {{ object }}?
        </p>
        <form method="post" class="mt-6">
          {% csrf_token %}
          <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-md transition duration-150 ease-in-out">
            {% translate "Yes, delete" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
